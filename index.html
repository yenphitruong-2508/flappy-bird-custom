<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #0f172a; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  canvas { border: 5px solid #ffffff; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); background: linear-gradient(to bottom, #38bdf8, #7dd3fc); cursor: pointer; }
</style>
</head>
<body>
<canvas id="gameCanvas" width="400" height="600"></canvas>
<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const rawBirdImg = new Image();
let processedBirdImg = new Image();
let imageLoaded = false;
rawBirdImg.src = "data:image/png;base64,INSERT_BIRD_BASE64_HERE";

rawBirdImg.onload = function() {
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = rawBirdImg.width;
    tempCanvas.height = rawBirdImg.height;
    const tempCtx = tempCanvas.getContext('2d');
    tempCtx.drawImage(rawBirdImg, 0, 0);
    
    const imgData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
    const data = imgData.data;
    for (let i = 0; i < data.length; i += 4) {
        let r = data[i], g = data[i+1], b = data[i+2];
        if (r > 220 && g > 220 && b > 220) {
            data[i+3] = 0;
        }
    }
    tempCtx.putImageData(imgData, 0, 0);
    processedBirdImg.src = tempCanvas.toDataURL();
    imageLoaded = true;
    drawStartScreen();
};

let bird = { x: 70, y: 220, width: 48, height: 38, gravity: 0.52, lift: -8.8, velocity: 0 };
let pipes = [];
let pipeWidth = 70, pipeGap = 160, pipeSpeed = 3;
let frameCount = 0, score = 0;
let highScore = localStorage.getItem("flappy_highScore") || 0;
let gameState = 'START'; 

function spawnPipe() {
  let topHeight = Math.floor(Math.random() * (canvas.height - pipeGap - 200)) + 60;
  pipes.push({ x: canvas.width, top: topHeight, bottomHeight: canvas.height - topHeight - pipeGap, passed: false });
}

function drawBackground() {
  // Nền trời Gradient 3D
  let skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  skyGrad.addColorStop(0, "#2563eb");
  skyGrad.addColorStop(0.5, "#38bdf8");
  skyGrad.addColorStop(1, "#bae6fd");
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Mây trắng bồng bềnh
  ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
  ctx.beginPath();
  ctx.arc(90, 100, 35, 0, Math.PI * 2);
  ctx.arc(130, 90, 45, 0, Math.PI * 2);
  ctx.arc(170, 105, 30, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(280, 210, 40, 0, Math.PI * 2);
  ctx.arc(325, 195, 55, 0, Math.PI * 2);
  ctx.fill();

  // Tòa nhà thành phố phía sau (Hiệu ứng đổ bóng)
  ctx.fillStyle = "#64748b";
  ctx.fillRect(30, canvas.height - 240, 50, 240);
  ctx.fillStyle = "#475569";
  ctx.fillRect(75, canvas.height - 190, 40, 190);
  ctx.fillStyle = "#64748b";
  ctx.fillRect(135, canvas.height - 270, 55, 270);
  ctx.fillStyle = "#334155";
  ctx.fillRect(225, canvas.height - 210, 45, 210);
  ctx.fillStyle = "#64748b";
  ctx.fillRect(280, canvas.height - 250, 60, 250);

  // Dải cây xanh nhiều lớp sống động
  ctx.fillStyle = "#16a34a";
  for (let i = 0; i < canvas.width; i += 45) {
    ctx.beginPath();
    ctx.arc(i + 22, canvas.height - 110, 38, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Mặt đất phía dưới có hiệu ứng khối nổi
  let groundGrad = ctx.createLinearGradient(0, canvas.height - 90, 0, canvas.height);
  groundGrad.addColorStop(0, "#4ade80");
  groundGrad.addColorStop(0.2, "#15803d");
  groundGrad.addColorStop(1, "#166534");
  ctx.fillStyle = groundGrad;
  ctx.fillRect(0, canvas.height - 90, canvas.width, 90);
  
  ctx.fillStyle = "#14532d";
  ctx.fillRect(0, canvas.height - 15, canvas.width, 15);
}

function drawPipe(pipe) {
  let capHeight = 28;
  let capOverflow = 5;

  // Hiệu ứng 3D Gradient cho ống nước
  let pipeGrad = ctx.createLinearGradient(pipe.x, 0, pipe.x + pipeWidth, 0);
  pipeGrad.addColorStop(0, "#15803d");
  pipeGrad.addColorStop(0.3, "#4ade80");
  pipeGrad.addColorStop(0.7, "#22c55e");
  pipeGrad.addColorStop(1, "#14532d");

  // Ống trên
  ctx.fillStyle = pipeGrad;
  ctx.fillRect(pipe.x, 0, pipeWidth, pipe.top);
  ctx.strokeStyle = "#052e16";
  ctx.lineWidth = 3;
  ctx.strokeRect(pipe.x, 0, pipeWidth, pipe.top);
  
  // Đầu ống trên
  ctx.fillRect(pipe.x - capOverflow, pipe.top - capHeight, pipeWidth + (capOverflow * 2), capHeight);
  ctx.strokeRect(pipe.x - capOverflow, pipe.top - capHeight, pipeWidth + (capOverflow * 2), capHeight);

  // Ống dưới
  let bottomY = canvas.height - pipe.bottomHeight;
  ctx.fillStyle = pipeGrad;
  ctx.fillRect(pipe.x, bottomY, pipeWidth, pipe.bottomHeight);
  ctx.strokeRect(pipe.x, bottomY, pipeWidth, pipe.bottomHeight);

  // Đầu ống dưới
  ctx.fillRect(pipe.x - capOverflow, bottomY, pipeWidth + (capOverflow * 2), capHeight);
  ctx.strokeRect(pipe.x - capOverflow, bottomY, pipeWidth + (capOverflow * 2), capHeight);
}

function drawBird(x, y, w, h, velocity) {
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2);
  let rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, velocity * 0.08));
  ctx.rotate(rotation);

  // Thêm bóng đổ cho chú chim sinh động
  ctx.shadowColor = "rgba(0, 0, 0, 0.4)";
  ctx.shadowBlur = 8;
  ctx.shadowOffsetY = 4;

  if (imageLoaded) {
      ctx.drawImage(processedBirdImg, -w / 2, -h / 2, w, h);
  } else {
      ctx.fillStyle = "#facc15";
      ctx.beginPath();
      ctx.arc(0, 0, w/2, 0, Math.PI * 2);
      ctx.fill();
  }
  ctx.restore();
}

function handleInput() {
  if (gameState === 'START') {
    gameState = 'PLAYING';
    resetGameVars();
    loop();
  } else if (gameState === 'PLAYING') {
    bird.velocity = bird.lift;
  } else if (gameState === 'OVER') {
    gameState = 'PLAYING';
    resetGameVars();
    loop();
  }
}

document.addEventListener("keydown", e => { 
  if (e.code === "Space") { 
    handleInput(); 
    e.preventDefault(); 
  } 
});

canvas.addEventListener("click", e => {
  handleInput();
});

function resetGameVars() {
  bird.y = 220; 
  bird.velocity = 0; 
  pipes = []; 
  score = 0; 
  frameCount = 0;
}

function drawStartScreen() {
  drawBackground();
  drawBird(canvas.width / 2 - 25, canvas.height / 2 - 80, 52, 42, 0);

  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 42px 'Segoe UI', sans-serif";
  ctx.textAlign = "center";
  ctx.shadowColor = "rgba(0, 0, 0, 0.6)";
  ctx.shadowBlur = 8;
  ctx.fillText("FLAPPY BIRD", canvas.width / 2, canvas.height / 2 - 15);
  
  ctx.fillStyle = "#fde047";
  ctx.font = "bold 22px 'Segoe UI', sans-serif";
  ctx.fillText("✨ Nhấn để Bắt Đầu ✨", canvas.width / 2, canvas.height / 2 + 50);
  ctx.shadowBlur = 0;
  ctx.textAlign = "left";
}

function drawScorecard() {
  ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  let boxWidth = 320;
  let boxHeight = 230;
  let boxX = (canvas.width - boxWidth) / 2;
  let boxY = (canvas.height - boxHeight) / 2 - 20;

  // Bảng điểm 3D dạng huy hiệu vàng
  let cardGrad = ctx.createLinearGradient(boxX, boxY, boxX, boxY + boxHeight);
  cardGrad.addColorStop(0, "#fef08a");
  cardGrad.addColorStop(1, "#ca8a04");
  
  ctx.fillStyle = cardGrad;
  ctx.strokeStyle = "#713f12";
  ctx.lineWidth = 4;
  ctx.fillRect(boxX, boxY, boxWidth, boxHeight);
  ctx.strokeRect(boxX, boxY, boxWidth, boxHeight);

  ctx.fillStyle = "#dc2626";
  ctx.font = "bold 34px 'Segoe UI', sans-serif";
  ctx.textAlign = "center";
  ctx.shadowColor = "rgba(0,0,0,0.3)";
  ctx.shadowBlur = 4;
  ctx.fillText("GAME OVER", canvas.width / 2, boxY + 45);
  ctx.shadowBlur = 0;

  ctx.fillStyle = "#422006";
  ctx.font = "bold 20px 'Segoe UI', sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("🎯 Điểm hiện tại:", boxX + 30, boxY + 105);
  ctx.textAlign = "right";
  ctx.fillText(score, boxX + boxWidth - 30, boxY + 105);

  ctx.textAlign = "left";
  ctx.fillText("🏆 Kỷ lục cao nhất:", boxX + 30, boxY + 155);
  ctx.textAlign = "right";
  ctx.fillText(highScore, boxX + boxWidth - 30, boxY + 155);

  // Nút Thử Lại nổi bật
  let btnWidth = 180;
  let btnHeight = 48;
  let btnX = (canvas.width - btnWidth) / 2;
  let btnY = boxY + boxHeight + 25;

  let btnGrad = ctx.createLinearGradient(btnX, btnY, btnX, btnY + btnHeight);
  btnGrad.addColorStop(0, "#ea580c");
  btnGrad.addColorStop(1, "#c2410c");

  ctx.fillStyle = btnGrad;
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 3;
  ctx.fillRect(btnX, btnY, btnWidth, btnHeight);
  ctx.strokeRect(btnX, btnY, btnWidth, btnHeight);

  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 22px 'Segoe UI', sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("🔄 THỬ LẠI", canvas.width / 2, btnY + 32);
  ctx.textAlign = "left";
}

function loop() {
  if (gameState !== 'PLAYING') return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawBackground();

  if (frameCount % 90 === 0) spawnPipe();

  for (let i = pipes.length - 1; i >= 0; i--) {
    pipes[i].x -= pipeSpeed;
    drawPipe(pipes[i]);

    if (!pipes[i].passed && pipes[i].x + pipeWidth < bird.x) {
      score++;
      pipes[i].passed = true;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem("flappy_highScore", highScore);
      }
    }

    let topCollision = bird.x < pipes[i].x + pipeWidth && bird.x + bird.width > pipes[i].x && bird.y < pipes[i].top;
    let bottomCollision = bird.x < pipes[i].x + pipeWidth && bird.x + bird.width > pipes[i].x && bird.y + bird.height > canvas.height - pipes[i].bottomHeight;

    if (topCollision || bottomCollision) {
      gameState = 'OVER';
    }

    if (pipes[i].x + pipeWidth < 0) {
      pipes.splice(i, 1);
    }
  }

  bird.velocity += bird.gravity;
  bird.y += bird.velocity;
  drawBird(bird.x, bird.y, bird.width, bird.height, bird.velocity);

  if (bird.y + bird.height >= canvas.height - 90 || bird.y <= 0) {
    gameState = 'OVER';
  }

  // Điểm số nổi bật khi đang chơi
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 44px 'Segoe UI', sans-serif";
  ctx.textAlign = "center";
  ctx.shadowColor = "rgba(0, 0, 0, 0.6)";
  ctx.shadowBlur = 6;
  ctx.fillText(score, canvas.width / 2, 70);
  ctx.shadowBlur = 0;
  ctx.textAlign = "left";

  if (gameState === 'OVER') {
    drawScorecard();
    return;
  }

  frameCount++;
  requestAnimationFrame(loop);
}

setTimeout(() => {
    drawStartScreen();
}, 200);
</script>
</body>
</html>
